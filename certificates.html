<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Certificates | Jibril Paddil</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="html5up-forty/assets/css/main.css" />
    <noscript><link rel="stylesheet" href="html5up-forty/assets/css/noscript.css" /></noscript>
    <style>
        :root { --panel: rgba(255,255,255,.055); --line: rgba(255,255,255,.12); }
        body {
            background: #20252a url("html5up-forty/images/front-photo-background3.png") center / cover fixed no-repeat;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(13, 13, 13, .2);
        }
        .certificates-page { padding:7rem 2rem 4rem; }
        .certificates-page .inner { max-width:1200px; margin:0 auto; }
        .certificate-intro { max-width:760px; margin-bottom:2.5rem; }
        .certificate-grid { column-count:3; column-gap:1rem; }
        .certificate-card {
            break-inside:avoid; margin:0 0 1rem; padding:1rem;
            background:var(--panel); border:1px solid var(--line); border-radius:8px;
        }
        .certificate-card h2 { margin:0 0 .65rem; font-size:1rem; line-height:1.3; }
        .certificate-card p { margin:0 0 1rem; font-size:.78rem; opacity:.7; }
        .certificate-card img,
        .certificate-card object { display:block; width:100%; border-radius:4px; background:#fff; }
        .certificate-card img { height:auto; max-height:420px; object-fit:contain; }
        .certificate-card .button { margin:0; }
        .certificate-card img { cursor:zoom-in; }
        .image-viewer {
            position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center;
            padding:2rem; background:rgba(0,0,0,.86); cursor:zoom-out;
        }
        .image-viewer[hidden] { display:none; }
        .image-viewer img { max-width:min(94vw, 1400px); max-height:92vh; width:auto; height:auto; object-fit:contain; cursor:default; }
        .image-viewer button { position:absolute; top:1rem; right:1rem; cursor:pointer; }
        @media screen and (max-width:900px) { .certificate-grid { column-count:2; } }
        @media screen and (max-width:560px) {
            .certificates-page { padding:6rem 1.25rem 3rem; }
            .certificate-grid { column-count:1; }
        }
    </style>
</head>
<body class="is-preload">
<div id="wrapper">
    <section class="certificates-page">
        <div class="inner">
            <a href="index.html#banner" class="button small next">Back to Home</a>
            <header class="major">
                <h1>Certificates & Training</h1>
            </header>
            <div class="certificate-intro">
                <p>Training, seminars, certifications, and professional development records.</p>
            </div>
            <div id="certificate-grid" class="certificate-grid" aria-label="Certificates and training records"></div>
            <ul class="actions">
                <li><a href="index.html#banner" class="button next">Back to Home</a></li>
            </ul>
        </div>
    </section>>
</div>
<div class="image-viewer" id="image-viewer" hidden role="dialog" aria-modal="true" aria-label="Expanded certificate image">
    <button type="button" class="button small" id="image-viewer-close" aria-label="Close expanded image">Close</button>
    <img id="image-viewer-image" alt="">
</div>
<script src="html5up-forty/assets/js/jquery.min.js"></script>
<script src="html5up-forty/assets/js/jquery.scrolly.min.js"></script>
<script src="html5up-forty/assets/js/browser.min.js"></script>
<script src="html5up-forty/assets/js/breakpoints.min.js"></script>
<script src="html5up-forty/assets/js/util.js"></script>
<script src="html5up-forty/assets/js/main.js"></script>
<script>
(function () {
    const folder = 'html5up-forty/Certificates/';
    const imageExt = /\.(png|jpe?g|jfif|webp|gif)$/i;
    const files = [
        'Tesda NCII.jpg',
        'Data Visualization of Safety Trends.jpg',
        'Developing Awareness on Circular Economy Principles and Practices.jpg',
        'English as a Meduim of Instruction.jpg',
        'English for Business and Entrepreneurship.jpg',
        'English for Science, Technology, Engineering and Mathematics (eSTEM).png',
        'English for Tourism Professionals.png',
        'Hazards and Risks in Smart Spaces.jpg',
        'Introduction to 3D Printing and Technology.png',
        'Introduction to Robots and Robotics.jpg',
        'Microsoft Digital Literacy.jpg',
        'Next-Gen Moves Slaying the College-toCareer Shift.png',
        'Orienting Oneself To Environmentally Sustainable Work Standards.jpg',
        'Participating in Workplace Communication.jpg',
        'Performing Solid Waste Management in the Workplace.jpg',
        'Receiving and Responding to Workplace Communciation.jpg',
        'Robot Combat Webinar.png',
        'Understanding and Presenting Safety Data.jpg',
        'Using Educational Technology in the English Language Classroom.jpg',
        'Working in a Gender-Diverse Environment.jpg'
        
    ];

    const grid = document.getElementById('certificate-grid');
    files.forEach(function (name) {
        const card = document.createElement('article');
        card.className = 'certificate-card';

        const title = document.createElement('h2');
        title.textContent = name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
        card.appendChild(title);

        const path = folder + encodeURIComponent(name).replace(/%2F/g, '/');
        if (imageExt.test(name)) {
            const image = document.createElement('img');
            image.src = path;
            image.alt = title.textContent;
            image.loading = 'lazy';
            card.appendChild(image);
        }

        const link = document.createElement('a');
        link.href = path;
        link.target = '_blank';
        link.rel = 'noopener';
        link.className = 'button small';
        link.textContent = 'Open Certificate';
        card.appendChild(link);
        grid.appendChild(card);
    });

    const viewer = document.getElementById('image-viewer');
    const viewerImage = document.getElementById('image-viewer-image');
    const closeViewer = function () {
        viewer.hidden = true;
        viewerImage.removeAttribute('src');
    };

    grid.addEventListener('click', function (event) {
        const image = event.target.closest('img');
        if (!image) return;
        viewerImage.src = image.src;
        viewerImage.alt = image.alt;
        viewer.hidden = false;
    });
    document.getElementById('image-viewer-close').addEventListener('click', closeViewer);
    viewer.addEventListener('click', function (event) {
        if (event.target === viewer) closeViewer();
    });
    document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeViewer();
    });
})();
</script>
</body>
</html>
