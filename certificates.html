<!DOCTYPE HTML>
<html lang="en">
<head>
    <title>Certificates | Jibril Paddil</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="html5up-forty/assets/css/main.css" />
    <noscript><link rel="stylesheet" href="html5up-forty/assets/css/noscript.css" /></noscript>
    <style>
        :root { --panel: rgba(255,255,255,.055); --line: rgba(255,255,255,.12); }
        body {
            background: #20252a url("html5up-forty/images/front-photo-background3.png") center / cover fixed no-repeat;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(13, 13, 13, .2);
        }
        .certificates-page { padding:7rem 2rem 4rem; }
        .certificates-page .inner { max-width:1200px; margin:0 auto; }
        .certificate-intro { max-width:760px; margin-bottom:2.5rem; }
        .certificate-grid { column-count:3; column-gap:1rem; }
        .certificate-card {
            break-inside:avoid; margin:0 0 1rem; padding:1rem;
            background:var(--panel); border:1px solid var(--line); border-radius:8px;
        }
        .certificate-card h2 { margin:0 0 .65rem; font-size:1rem; line-height:1.3; }
        .certificate-card p { margin:0 0 1rem; font-size:.78rem; opacity:.7; }
        .certificate-card img,
        .certificate-card object { display:block; width:100%; border-radius:4px; background:#fff; }
        .certificate-card img { height:auto; max-height:420px; object-fit:contain; }
        .certificate-card .button { margin:0; }
        .certificate-card img { cursor:zoom-in; }
        .image-viewer {
            position:fixed; inset:0; z-index:1000; width:min(96vw, 1400px); max-width:none; max-height:92vh;
            margin:auto; padding:2rem; border:1px solid #657278; background:#111518; color:#f1f3f4;
        }
        .image-viewer:not([open]) { display:none; }
        .image-viewer::backdrop { background:rgba(0,0,0,.86); }
        .image-viewer img { max-width:min(94vw, 1400px); max-height:92vh; width:auto; height:auto; object-fit:contain; cursor:default; }
        .image-viewer button { position:absolute; top:1rem; right:1rem; cursor:pointer; }
        @media screen and (max-width:900px) { .certificate-grid { column-count:2; } }
        @media screen and (max-width:560px) {
            .certificates-page { padding:6rem 1.25rem 3rem; }
            .certificate-grid { column-count:1; }
        }
    </style>
    <link rel="stylesheet" href="portfolio.css" />
</head>
<body id="top" class="is-preload">
<div id="wrapper">
    <main class="certificates-page">
        <div class="inner">
            <nav aria-label="Page navigation">
                <a href="index.html" class="button small">Home</a>
                <a href="index.html#projects" class="button small">Projects</a>
                <a href="training.html" class="button small">Technical Training</a>
            </nav>
            <header class="major">
                <h1>Certificates &amp; Training</h1>
            </header>
            <div class="certificate-intro">
                <p>Certificates currently available in the portfolio. Issuers and dates are shown only when verified.</p>
            </div>
            <div id="certificate-grid" class="certificate-grid" aria-label="Certificates and training records"></div>
            <ul class="actions">
                <li><a href="#top" class="button next">Back to Top</a></li>
            </ul>
        </div>
    </main>
</div>
<dialog class="image-viewer" id="image-viewer" aria-label="Expanded certificate image">
    <form method="dialog"><button id="image-viewer-close" type="submit" class="button small" aria-label="Close expanded image">Close</button></form>
</dialog>
<script src="html5up-forty/assets/js/jquery.min.js"></script>
<script src="html5up-forty/assets/js/jquery.scrolly.min.js"></script>
<script src="html5up-forty/assets/js/browser.min.js"></script>
<script src="html5up-forty/assets/js/breakpoints.min.js"></script>
<script src="html5up-forty/assets/js/util.js"></script>
<script src="html5up-forty/assets/js/main.js"></script>
<script>
(function () {
    const folder = 'html5up-forty/Certificates/';
    const imageExt = /\.(png|jpe?g|jfif|webp|gif)$/i;
    const certificates = [
        { file: 'Tesda NCII.jpg', title: 'TESDA Mechatronics Servicing NC II' },
        { file: 'Data Visualization of Safety Trends.jpg' },
        { file: 'Developing Awareness on Circular Economy Principles and Practices.jpg' },
        { file: 'English as a Meduim of Instruction.jpg' },
        { file: 'English for Business and Entrepreneurship.jpg' },
        { file: 'English for Science, Technology, Engineering and Mathematics (eSTEM).jpg' },
        { file: 'English for Tourism Professionals.jpg' },
        { file: 'Hazards and Risks in Smart Spaces.jpg' },
        { file: 'Introduction to 3D Printing and Technology.png' },
        { file: 'Introduction to Robots and Robotics.jpg' },
        { file: 'Microsoft Digital Literacy.jpg' },
        { file: 'Next-Gen Moves Slaying the College-toCareer Shift.png' },
        { file: 'Orienting Oneself To Environmentally Sustainable Work Standards.jpg' },
        { file: 'Participating in Workplace Communication.jpg' },
        { file: 'Performing Solid Waste Management in the Workplace.jpg' },
        { file: 'Receiving and Responding to Workplace Communciation.jpg' },
        { file: 'Robot Combat Webinar.png' },
        { file: 'Understanding and Presenting Safety Data .jpg', title: 'Understanding and Presenting Safety Data' },
        { file: 'Using Educational Technology in the English Language Classroom.jpg' },
        { file: 'Working in a Gender-Diverse Environment.jpg' }
    ];

    const grid = document.getElementById('certificate-grid');
    certificates.forEach(function (certificate) {
        const name = certificate.file;
        const card = document.createElement('article');
        card.className = 'certificate-card';

        const title = document.createElement('h2');
        title.textContent = certificate.title || name.replace(/\.[^.]+$/, '').trim().replace(/[_-]+/g, ' ');
        card.appendChild(title);

        const path = folder + encodeURIComponent(name).replace(/%2F/g, '/');
        const metadata = document.createElement('dl');
        metadata.className = 'certificate-metadata';
        [['Issuing organization', certificate.issuer], ['Date', certificate.date]].forEach(function (item) {
            if (!item[1]) return;
            const term = document.createElement('dt');
            term.textContent = item[0];
            const value = document.createElement('dd');
            value.textContent = item[1];
            metadata.append(term, value);
        });
        if (metadata.childElementCount) card.appendChild(metadata);

        if (imageExt.test(name)) {
            const image = document.createElement('img');
            image.src = path;
            image.alt = 'Certificate: ' + title.textContent;
            image.loading = 'lazy';
            image.tabIndex = 0;
            image.setAttribute('role', 'button');
            image.setAttribute('aria-label', 'Enlarge ' + image.alt);
            card.appendChild(image);
        }

        const link = document.createElement('a');
        link.href = path;
        link.target = '_blank';
        link.rel = 'noopener';
        link.className = 'button small';
        link.textContent = 'Open Certificate';
        card.appendChild(link);
        grid.appendChild(card);
    });

    const viewer = document.getElementById('image-viewer');
    let viewerImage;
    let lastFocusedImage;
    const closeViewer = function () {
        if (viewer.open) viewer.close();
    };
    viewer.addEventListener('close', function () {
        if (viewerImage) viewerImage.removeAttribute('src');
        if (lastFocusedImage) lastFocusedImage.focus();
    });

    grid.addEventListener('click', function (event) {
        const image = event.target.closest('img');
        if (!image) return;
        if (!viewerImage) {
            viewerImage = document.createElement('img');
            viewer.appendChild(viewerImage);
        }
        viewerImage.src = image.src;
        viewerImage.alt = image.alt;
        lastFocusedImage = image;
        viewer.showModal();
    });
    grid.querySelectorAll('img').forEach(function (image) {
        image.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                image.click();
            }
        });
    });
    document.getElementById('image-viewer-close').addEventListener('click', function (event) {
        event.preventDefault();
        closeViewer();
    });
    viewer.addEventListener('click', function (event) {
        if (event.target === viewer) closeViewer();
    });
})();
</script>
</body>
</html>
